services:
  backend:
    runtime: runc
    build: ./backend
    environment:
      PORT: "4000"
      CUDA_VISIBLE_DEVICES: ""
      DATA_DIR: /app/runtime
      RAW_ROOT: /app/raw
      STRUCTURED_ROOT: /app/structured/records
      RETRIEVAL_CONFIG: /app/retrieval/backend/src/data/retrieval.json
      TOPK_FILE: /app/retrieval/top20_related_patients.csv
      LLM_RETRIEVAL_ROOT: /app/llm_retrieval
    volumes:
      - ${WEB_DATA_ROOT:?Set WEB_DATA_ROOT}/runtime:/app/runtime
      - ${WEB_DATA_ROOT}/raw:/app/raw:ro
      - ${WEB_DATA_ROOT}/structured_v2:/app/structured:ro
      - ${WEB_DATA_ROOT}/retrieval:/app/retrieval:ro
      - ${WEB_DATA_ROOT}/llm_retrieval:/app/llm_retrieval:ro
    restart: unless-stopped
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
  frontend:
    runtime: runc
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    ports:
      - "127.0.0.1:${WEB_PORT:-5178}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
